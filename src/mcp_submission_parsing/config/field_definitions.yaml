
# ── Regex Patterns ────────────────────────────────────────────────────────────
patterns:
  policy_number:
    - '(?:policy\s*(?:number|#|ref|reference)?\s*[:#]?\s*)?(POL-\d{6})'
    - 'POL-\d{6}'
  
  incident_date:
    - '(?:incident|accident|loss|claim)?\s*(?:date)?\s*[:#]?\s*(\d{4}-\d{2}-\d{2})'
    - '(?:incident|accident|loss)\s*(?:date)?\s*[:#]?\s*(\d{1,2}/\d{1,2}/\d{4})'
  
  year_make_model:
    - '(\d{4})\s+(Toyota|Honda|Ford|Chevrolet|BMW|Nissan|Jeep|Dodge|Hyundai|Kia)\s+([A-Za-z0-9\-]+)'
  
  incident_type:
    - '(?:incident|accident|collision|claim)\s*(?:type|description)?\s*[:#]?\s*(Single Vehicle Collision|Multi-vehicle Collision|Parked Car|Vehicle Theft|Other)'
    - '\b(Single Vehicle Collision|Multi-vehicle Collision|Parked Car|Vehicle Theft|Other)\b'

  incident_severity:
    - '(?:damage|severity)\s*(?:assessed\s*as|level)?\s*[:#]?\s*(Minor Damage|Major Damage|Total Loss|Trivial Damage)'
    - '\b(Minor Damage|Major Damage|Total Loss|Trivial Damage)\b'
  
  incident_location:
    - '(?:location|place|at)\s*[:#]?\s*(Highway|Parking Lot|Local Road|Interstate|Residential Street)'
  
  city_state:
    - '(?:in|at)\s+([A-Z][a-z]+(?:\s[A-Z][a-z]+)*)\s*[,]\s*([A-Z]{2})'
  
  auto_year:
    - '(?:vehicle|car|auto)\s*(?:year|model\s*year)?\s*[:#]?\s*(\d{4})'
  
  make_model:
    - '(Toyota|Honda|Ford|Chevrolet|BMW|Nissan|Jeep|Dodge|Hyundai|Kia)\s+([A-Z][a-z]+(?:\s?-?[A-Z]?\d+)?)'
  
  authorities_contacted:
    - '(?:authorities|contacted|called)\s*[:#]?\s*(Police|Fire|Ambulance|None|Other)'
  
  collision_type:
    - '(?:collision|impact)\s*(?:type)?\s*[:#]?\s*(Front Collision|Rear Collision|Side Collision)'
  
  number_of_vehicles:
    - '(?:number\s*of\s*vehicles|vehicles\s*involved)\s*[:#]?\s*(\d+)'
  
  bodily_injuries:
    - '(?:bodily\s*injuries|injuries|people\s*hurt)\s*[:#]?\s*(\d+)'
  
  witnesses:
    - '(?:witnesses|witness)\s*[:#]?\s*(\d+)'
  
  police_report:
    - '(?:police\s*report)\s*(?:available|filed)?\s*[:#]?\s*(YES|NO|Yes|No|Y|N)'
    - '(?:police\s*report)\s*(filed|available|submitted)'
  
  property_damage:
    - '(?:property\s*damage)\s*[:#]?\s*(YES|NO|Yes|No|Y|N|\?)'
  
  total_claim_amount:
    - '(?:total\s*claim\s*amount|claim\s*amount|amount)\s*[:#]?\s*\$?([\d,]+\.?\d*)'
  
  incident_hour:
    - '(?:time|hour|at)\s*[:#]?\s*(\d{1,2})(?:\s*)?(?:AM|PM|am|pm)?'

