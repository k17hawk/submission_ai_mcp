# ── Regex Patterns ────────────────────────────────────────────────────────────
patterns:
  # Core identifiers
  policy_number:
    - '(?:policy\s*(?:number|#|ref|reference)?\s*[:#]?\s*)?(POL-\d{6})'
    - 'POL-\d{6}'
    - 'Policy\s+(POL[-\s]?\d{6})'                     # "Policy POL-651065"
    - 'POL[-](\d{6})'                                 # "POL-651065"
    - 'policy[:\s#]+(POL[-]?\d{6})'

  customer_id:
    - 'CUST[-](\d{5,})'                               # "CUST-93810"
    - 'customer[:\s#]+(CUST[-]?\d+)'

  customer_name:
    - 'Name[:\s]+([A-Z][a-z]+(?:\s+[A-Z][a-z]+)+)(?:\s+with|\s+CUST|\s+policy|$)'
    - '^([A-Z][a-z]+\s+[A-Z][a-z]+)(?:\s+with|\s+CUST)'

  # Date / Time
  incident_date:
    - 'at\s+(\d{4}-\d{2}-\d{2})'                     # "at 2022-08-09"
    - 'on\s+(\d{4}-\d{2}-\d{2})'
    - '\bon\s+(\d{1,2}/\d{1,2}/\d{4})'
    - '(?:incident|accident|loss|claim)?\s*(?:date)?\s*[:#]?\s*(\d{4}-\d{2}-\d{2})'
    - '(?:incident|accident|loss)\s*(?:date)?\s*[:#]?\s*(\d{1,2}/\d{1,2}/\d{4})'

  incident_time:
    - '(\d{1,2})\s*(?:hours?|hrs?)\s+ago'            # "8 hours ago"
    - '(?:at|around)\s+(\d{1,2}(?::\d{2})?\s*(?:AM|PM|am|pm))'

  incident_hour_of_the_day:                          # Derived field, but pattern for raw hour
    - '(?:time|hour|at)\s*[:#]?\s*(\d{1,2})(?:\s*)?(?:AM|PM|am|pm)?'

  # Incident details
  

  # incident_type: the pileup pattern was capturing the number as group 1
  incident_type:
    - '\b(Single Vehicle Collision|Multi-vehicle Collision|Parked Car|Vehicle Theft|Other)\b'
    - '(Single\s+Vehicle|Multi-vehicle|Parked\s+Car|Vehicle\s+Theft)'
    - '\d+[-\s]?(?:car|vehicle)\s+(?:pileup|collision|accident|crash)'  # no capture group → handled by mapping

  # incident_state: require exactly 2 uppercase letters as a standalone token
  incident_state:
  - '(?:at|in|near)\s+([A-Z]{2})\s+[A-Z][a-z]'    
  - '\b(A[LKZR]|C[AOT]|D[EC]|FL|GA|HI|I[ADLN]|K[SY]|LA|M[ADEINOST]|N[CDEHJMVY]|O[HKR]|P[AR]|RI|S[CD]|T[NX]|UT|V[AT]|W[AVIY])\b'

  incident_location:
    - '(I-\d+)'
    - '(Highway\s*\d+)'
    - '\b(Parking\s+Lot|Local\s+Road|Residential\s+Street|Freeway)\b'
    - '(?:location|place)\s*[:#]?\s*(Highway|Parking Lot|Local Road|Interstate|Residential Street)'
    

  collision_type:
    - '(Front|Rear|Side)\s+(?:Collision|End|Impact)'
    - '(Head-On|T-Bone|Sideswipe|Rear-End)'
    - '(?:collision|impact)\s*(?:type)?\s*[:#]?\s*(Front Collision|Rear Collision|Side Collision)'

  incident_severity:
    - '(?:damage|severity)\s*(?:assessed\s*as|level)?\s*[:#]?\s*(Minor Damage|Major Damage|Total Loss|Trivial Damage)'
    - '\b(Minor Damage|Major Damage|Total Loss|Trivial Damage)\b'



  incident_city:
    - '(?:at|in)\s+[A-Z]{2}\s+([A-Z][a-z]+(?:\s+[A-Z][a-z]+)?)'   
    - '(?:at|in)\s+([A-Z][a-z]+(?:\s+[A-Z][a-z]+)?)\s+(?:[A-Z]{2})\b'

  city_state:
    - '(?:in|at)\s+([A-Z][a-z]+(?:\s[A-Z][a-z]+)*)\s*[,]\s*([A-Z]{2})'

  # Vehicle information
  auto_year:
    - '(?<!\d)(19[8-9]\d|20[0-1]\d)(?!\d)'           # Avoid matching date years
    - '(?:vehicle|car|auto)\s*(?:year|model\s*year)?\s*[:#]?\s*(\d{4})'

  auto_make:
    - '\b(Toyota|Honda|Ford|Chevrolet|BMW|Nissan|Jeep|Dodge|Hyundai|Kia|Subaru|Tesla|Mercedes|Audi)\b'

  auto_model:
    - '(?:Chevrolet|Ford|Toyota|Honda|Nissan|Jeep|Dodge|Hyundai|Kia|Subaru|BMW|Audi|Mercedes)\s+([A-Z][a-zA-Z0-9]+(?:\s[A-Z][a-zA-Z0-9]+)?)'

  year_make_model:
    - '(\d{4})\s+(Toyota|Honda|Ford|Chevrolet|BMW|Nissan|Jeep|Dodge|Hyundai|Kia)\s+([A-Za-z0-9\-]+)'

  make_model:
    - '(Toyota|Honda|Ford|Chevrolet|BMW|Nissan|Jeep|Dodge|Hyundai|Kia)\s+([A-Z][a-z]+(?:\s?-?[A-Z]?\d+)?)'

  # Claim metrics
  number_of_vehicles:
    - '(\d+)[-\s]?(?:car|vehicle)s?\s+(?:pileup|collision|accident|crash|involved)'
    - '(\d+)\s+vehicles?\s+involved'
    - '(?:number\s*of\s*vehicles|vehicles\s*involved)\s*[:#]?\s*(\d+)'

  witnesses:
    - '(\d+)\s+witnesses?'
    - 'witness(?:es)?\s*:?\s*(\d+)'
    - '(?:witnesses|witness)\s*[:#]?\s*(\d+)'

  bodily_injuries:
    - '(\d+)\s+(?:people|persons?|individuals?)\s+(?:injured|hurt)'
    - '(\d+)\s+injur(?:y|ies)'
    - '(?:bodily\s*injuries|injuries|people\s*hurt)\s*[:#]?\s*(\d+)'

  police_report:
    - 'police\s+report\s+(available|filed|yes|true)'
    - '(?:no|without)\s+police\s+report'
    - '(?:police\s*report)\s*(?:available|filed)?\s*[:#]?\s*(YES|NO|Yes|No|Y|N)'
    - '(?:police\s*report)\s*(filed|available|submitted)'

  property_damage:                                   # YES/NO field
    - '(?:property\s*damage)\s*[:#]?\s*(YES|NO|Yes|No|Y|N|\?)'

  property_damage_amount:                            # Dollar amount for property damage
    - 'property\s+damage\s+(?:estimated|around|about)?\s*\$?\s*([\d,]+)'

  total_claim_amount:
    - '\$\s*([\d,]+(?:\.\d{2})?)'
    - '(?:damage|claim|amount)[:\s]+\$?\s*([\d,]+(?:\.\d{2})?)'
    - '(?:total\s*claim\s*amount|claim\s*amount|amount)\s*[:#]?\s*\$?([\d,]+\.?\d*)'

  authorities_contacted:
    - '(?:authorities|contacted|called)\s*[:#]?\s*(Police|Fire|Ambulance|None|Other)'

